name: Release
on:
  push:
    tags: ["v*"]
  # Re-run for a tag that is already released (e.g. npm refused it): builds again, keeps the GitHub release as is.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.15.0"
        required: true

permissions:
  contents: write
  id-token: write # npm trusted publishing (no token needed)

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Release notes from CHANGELOG.md
        run: |
          bun scripts/release-notes.ts "${TAG}" > notes.md
          prev=$(git tag --sort=-v:refname --merged HEAD | grep -vx "${TAG}" | head -1)
          [ -n "$prev" ] && printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "$prev" "${TAG}" >> notes.md
          cat notes.md
      - run: bun run test
      - name: Build binaries (web UI embedded)
        run: bun scripts/build-bin.ts "${TAG}"
      # Developer ID signing + notarization: macOS remembers folder access (Desktop, Documents...) by the
      # signing identity, so users click Allow once instead of after every update. Without the secrets
      # (forks, or before they are set) it falls back to ad-hoc signing so a release never breaks.
      - name: Import Developer ID certificate
        id: cert
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ] || [ -z "$APPLE_CERT_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple signing secrets are not all set: signing ad-hoc and skipping notarization. Users will be asked for folder access again after this update."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/ckanban-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASS"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Apple's Developer ID intermediate, in case the runner image lacks it (the .p12 usually holds only the leaf).
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" >/dev/null 2>&1 || true
          # No -v: pick the identity even if its chain isn't trusted yet; "Verify signatures" checks the result.
          ID="$(security find-identity -p codesigning "$KC" | awk '/"Developer ID Application/ { print $2; exit }')"
          if [ -z "$ID" ]; then
            echo "::error::No Developer ID Application identity in APPLE_CERT_P12_BASE64 (a different certificate type, or the private key is missing)."
            exit 1
          fi
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
      - name: Sign macOS binaries
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          ENT=scripts/macos/entitlements.plist
          # A re-run for an older tag checks out that tag, which may predate the file: take it from the workflow's commit.
          if [ ! -f "$ENT" ]; then ENT="$RUNNER_TEMP/entitlements.plist"; git show "$GITHUB_SHA:scripts/macos/entitlements.plist" > "$ENT"; fi
          for f in dist/ckanban-darwin-*; do
            if [ -n "$IDENTITY" ]; then
              # Hardened runtime (required for notarization) with Bun's JIT entitlements.
              codesign --force --options runtime --timestamp --identifier io.ckanban.daemon \
                --entitlements "$ENT" --keychain "$KEYCHAIN" --sign "$IDENTITY" "$f"
            else
              codesign --force --sign - "$f"
            fi
          done
      - name: Verify signatures
        if: steps.cert.outputs.identity != ''
        run: |
          for f in dist/ckanban-darwin-*; do
            codesign --verify --strict --verbose=2 "$f"
            info="$(codesign -dv --verbose=4 "$f" 2>&1)"
            echo "$info" | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)'
            echo "$info" | grep -q '^Authority=Developer ID Application' || { echo "::error::$f is not signed with Developer ID"; exit 1; }
            echo "$info" | grep -q 'flags=.*runtime' || { echo "::error::$f lacks the hardened runtime"; exit 1; }
          done
      - name: Smoke test
        run: |
          ./dist/ckanban-darwin-arm64 --version
          test "$(./dist/ckanban-darwin-arm64 --version)" = "${TAG#v}"
          # The runner is Apple silicon; run the Intel build too when Rosetta is there.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            test "$(./dist/ckanban-darwin-x64 --version)" = "${TAG#v}"
          else
            echo "Rosetta not installed: x64 build not run"
          fi
      - name: Notarize
        if: steps.cert.outputs.identity != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Bare binaries can't be stapled; Gatekeeper looks the ticket up online on first run.
          for f in dist/ckanban-darwin-*; do
            zip="$RUNNER_TEMP/$(basename "$f").zip"
            ditto -c -k --keepParent "$f" "$zip"
            out="$(xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json)" || true
            echo "$out"
            status="$(printf '%s' "$out" | plutil -extract status raw -o - - 2>/dev/null || true)"
            id="$(printf '%s' "$out" | plutil -extract id raw -o - - 2>/dev/null || true)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            fi
            if [ "$status" != "Accepted" ]; then
              echo "::error::Notarization of $f ended with status '${status:-unknown}'"
              exit 1
            fi
            rm -f "$zip"
          done
      - name: Checksums
        run: cd dist && shasum -a 256 ckanban-darwin-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Already released (a re-run for npm): keep the published files and checksums as they are.
          if gh release view "${TAG}" >/dev/null 2>&1; then echo "Release ${TAG} exists, not changed"; exit 0; fi
          gh release create "${TAG}" dist/ckanban-darwin-arm64 dist/ckanban-darwin-x64 dist/SHA256SUMS --notes-file notes.md --title "${TAG}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish npm installer (npm trusted publisher, no token)
        working-directory: npm
        run: |
          npm install -g npm@latest
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          # Goes live at once if the trusted publisher allows `npm publish`; otherwise it is staged
          # and Leo approves it on npmjs.com.
          npm publish --access public || npm stage publish --access public
      - name: Remove signing keychain
        if: always() && steps.cert.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
