name: Release
on:
  push:
    tags: ["v*"]
  # Re-run for a tag that is already released (e.g. npm refused it): builds again, keeps the GitHub release as is.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.15.0"
        required: true

permissions:
  contents: write
  id-token: write # npm trusted publishing (no token needed)

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Release notes from CHANGELOG.md
        run: |
          bun scripts/release-notes.ts "${TAG}" > notes.md
          prev=$(git tag --sort=-v:refname --merged HEAD | grep -vx "${TAG}" | head -1)
          [ -n "$prev" ] && printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "$prev" "${TAG}" >> notes.md
          cat notes.md
      - run: bun run test
      - name: Build binaries (web UI embedded)
        run: bun scripts/build-bin.ts "${TAG}"
      - name: Ad-hoc sign
        run: for f in dist/ckanban-darwin-*; do codesign --force --sign - "$f"; done
      - name: Smoke test
        run: |
          ./dist/ckanban-darwin-arm64 --version
          test "$(./dist/ckanban-darwin-arm64 --version)" = "${TAG#v}"
      - name: Checksums
        run: cd dist && shasum -a 256 ckanban-darwin-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Already released (a re-run for npm): keep the published files and checksums as they are.
          if gh release view "${TAG}" >/dev/null 2>&1; then echo "Release ${TAG} exists, not changed"; exit 0; fi
          gh release create "${TAG}" dist/ckanban-darwin-arm64 dist/ckanban-darwin-x64 dist/SHA256SUMS --notes-file notes.md --title "${TAG}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish npm installer (npm trusted publisher, no token)
        working-directory: npm
        run: |
          npm install -g npm@latest
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          # Goes live at once if the trusted publisher allows `npm publish`; otherwise it is staged
          # and Leo approves it on npmjs.com.
          npm publish --access public || npm stage publish --access public
