[package]
name = "ckanban-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust front server for the ckanban daemon (trial): passes every request to the Bun daemon"

[[bin]]
name = "ckanban-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "io-util", "sync"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
